<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Квиз · подготовка Full-stack / НаТочку</title>
    <link rel="stylesheet" href="quiz.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <p class="eyebrow">hire-prep · локально</p>
        <h1>Квиз самоподготовки</h1>
        <p class="lead">
          JS / TS / React / Next / Prisma / НаТочку. Баллы сразу, без сервера — открой файл в браузере.
        </p>
      </header>

      <section id="start" class="card">
        <label class="field">
          Имя (для итога)
          <input id="player" type="text" placeholder="Eugene" autocomplete="name" />
        </label>
        <label class="field">
          Сколько вопросов
          <select id="count">
            <option value="10">10</option>
            <option value="15" selected>15 (все)</option>
          </select>
        </label>
        <button id="btnStart" type="button" class="btn">Начать</button>
      </section>

      <section id="quiz" class="card hidden" aria-live="polite">
        <div class="meta">
          <span id="progress"></span>
          <span id="scoreLive"></span>
        </div>
        <p id="cat" class="cat"></p>
        <h2 id="question"></h2>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback"></p>
        <button id="btnNext" type="button" class="btn" disabled>Далее</button>
      </section>

      <section id="result" class="card hidden">
        <h2>Итог</h2>
        <p id="resultSummary" class="result-big"></p>
        <ul id="byCat" class="by-cat"></ul>
        <p id="grade" class="grade"></p>
        <button id="btnRetry" type="button" class="btn">Ещё раз</button>
      </section>
    </main>
    <script src="questions.js"></script>
    <script src="quiz.js"></script>
  </body>
</html>
